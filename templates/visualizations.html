{% extends "base.html" %}

{% block content %}
    <div class="mb-4">
        <h2 class="fw-bold"><i class="fas fa-chart-bar text-primary me-2"></i>Data Visualizations</h2>
        <p class="text-muted">Analyzing community activity and global statistics.</p>
    </div>

    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white py-3">
                    <h5 class="card-title mb-0 fw-bold">Posts per Category</h5>
                </div>
                <div class="card-body p-4">
                    <div style="height: 400px;">
                        <canvas id="postsPerCategoryChart"></canvas>
                    </div>
                </div>
                <div class="card-footer bg-light border-0 small text-muted">
                    <i class="fas fa-info-circle me-1"></i> Data updated in real-time based on community posts.
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        $(function () {
            $.ajax({
                url: '{{ url_for('data_posts_per_category') }}',
                success: function(data) {
                    var ctx = document.getElementById('postsPerCategoryChart').getContext('2d');
                    var chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Posts per Category',
                                data: data.values,
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderColor: 'rgba(75, 192, 192, 1)',
                                borderWidth: 1
                            }]
                        },
                        options: {
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            });
        });
    </script>
{% endblock %}
