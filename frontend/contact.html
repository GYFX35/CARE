<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="magazine.html">Magazine</a></li>
                <li><a href="topics.html">Topics</a></li>

                <li><a href="contact.html">Contact Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="/index">Main App</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h1 class="mb-4 text-center">Contact Us</h1>
            <p class="text-center mb-5">If you have any questions or would like to get in touch with us, please use the form below.</p>
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" id="name" name="name" class="form-control" placeholder="Your Name" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" placeholder="Your Email" required>
                        </div>
                        <div class="mb-3">
                            <label for="message" class="form-label">Message</label>
                            <textarea id="message" name="message" rows="5" class="form-control" placeholder="How can we help you?" required></textarea>
                        </div>
                        <div>
                            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Send Message</button>
                        </div>
                    </form>
                </div>
            </div>
        </section>
    </main>
    <footer>
